name: dbt CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  dbt-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/cgm_dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          pip install dbt-bigquery

      - name: dbt deps
        run: |
          dbt deps

      - name: dbt parse (fast sanity)
        run: |
          dbt parse